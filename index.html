<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DOT EDITOR — ドット絵エディタ</title>
<style>
  :root{
    --bg:#14161a; --panel:#1c1f26; --panel2:#242833; --line:#333949;
    --fg:#e6e9f0; --dim:#8b93a7; --accent:#59c2ff; --accent2:#ffb454;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--fg); overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    font-size:13px; user-select:none;
  }
  #app{display:flex; height:100%}

  /* ---- 左ツールバー ---- */
  #tools{
    width:56px; flex:none; background:var(--panel); border-right:1px solid var(--line);
    display:flex; flex-direction:column; align-items:center; gap:4px; padding:8px 0; overflow-y:auto;
  }
  .tbtn{
    width:42px;height:42px; border:1px solid transparent; border-radius:8px; background:var(--panel2);
    color:var(--fg); font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    flex-direction:column; line-height:1;
  }
  .tbtn small{font-size:8px;color:var(--dim);margin-top:2px}
  .tbtn:hover{background:#2e3342}
  .tbtn.on{background:var(--accent); color:#0d1117; border-color:#8fd7ff}
  .tbtn.on small{color:#0d1117}
  .sep{width:32px;height:1px;background:var(--line);margin:4px 0}

  /* ---- 中央 ---- */
  #center{flex:1; display:flex; flex-direction:column; min-width:0}
  #topbar{
    height:44px; flex:none; background:var(--panel); border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:8px; padding:0 10px; overflow-x:auto; white-space:nowrap;
  }
  #stage{
    flex:1; overflow:auto; display:flex; align-items:center; justify-content:center; padding:24px;
    background:
      linear-gradient(0deg,rgba(255,255,255,.02),rgba(255,255,255,.02)),
      var(--bg);
  }
  #wrap{position:relative; line-height:0; box-shadow:0 0 0 1px #000, 0 8px 40px rgba(0,0,0,.6)}
  #wrap.checker{
    background-color:#5a5f6b;
    background-image:
      linear-gradient(45deg,#3d414b 25%,transparent 25%),
      linear-gradient(-45deg,#3d414b 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#3d414b 75%),
      linear-gradient(-45deg,transparent 75%,#3d414b 75%);
    background-size:16px 16px;
    background-position:0 0,0 8px,8px -8px,-8px 0;
  }
  #cv,#ov{display:block; position:absolute; left:0; top:0}
  #cv{position:relative; image-rendering:pixelated}
  #ov{pointer-events:none}

  /* ---- 右パネル ---- */
  #side{
    width:268px; flex:none; background:var(--panel); border-left:1px solid var(--line);
    overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:12px;
  }
  .box{background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:9px}
  .box h3{margin:0 0 8px; font-size:11px; letter-spacing:.08em; color:var(--dim); font-weight:600}
  .row{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
  .row + .row{margin-top:6px}

  button, select, input[type=number], input[type=text]{
    background:var(--panel2); color:var(--fg); border:1px solid var(--line);
    border-radius:6px; padding:5px 8px; font:inherit; font-size:12px; cursor:pointer;
  }
  #side .box button, #side .box select, #side .box input{background:#1a1d25}
  button:hover{background:#30364a}
  button.primary{background:var(--accent); color:#0d1117; border-color:#8fd7ff; font-weight:700}
  button.primary:hover{filter:brightness(1.1)}
  button:disabled{opacity:.35; cursor:default}
  input[type=number]{width:62px; cursor:text}
  label{color:var(--dim); font-size:11px}

  /* パレット */
  #pal{display:grid; grid-template-columns:repeat(16,1fr); gap:1px; background:#0f1116; padding:2px; border-radius:6px}
  #pal div{padding-bottom:100%; position:relative; cursor:pointer; border-radius:1px}
  #pal div.sel{outline:2px solid #fff; outline-offset:-2px; z-index:2}
  #curcol{width:34px;height:34px;border-radius:6px;border:1px solid var(--line)}

  /* フレーム */
  #frames{display:flex; gap:6px; flex-wrap:wrap}
  .fr{position:relative; border:2px solid var(--line); border-radius:7px; padding:3px; background:#0f1116; cursor:pointer}
  .fr.on{border-color:var(--accent)}
  .fr canvas{display:block; width:48px; height:48px; image-rendering:pixelated;
    background-color:#5a5f6b;
    background-image:linear-gradient(45deg,#3d414b 25%,transparent 25%),linear-gradient(-45deg,#3d414b 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#3d414b 75%),linear-gradient(-45deg,transparent 75%,#3d414b 75%);
    background-size:10px 10px; background-position:0 0,0 5px,5px -5px,-5px 0;}
  .fr b{position:absolute; left:2px; top:2px; font-size:9px; background:rgba(0,0,0,.6); padding:0 3px; border-radius:3px; color:#fff}

  #preview{background-color:#5a5f6b; image-rendering:pixelated; border-radius:6px; display:block; margin:0 auto;
    background-image:linear-gradient(45deg,#3d414b 25%,transparent 25%),linear-gradient(-45deg,#3d414b 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#3d414b 75%),linear-gradient(-45deg,transparent 75%,#3d414b 75%);
    background-size:12px 12px; background-position:0 0,0 6px,6px -6px,-6px 0;}

  #pos{color:var(--dim); font-variant-numeric:tabular-nums; margin-left:auto; padding-right:4px}
  .hint{color:var(--dim); font-size:10.5px; line-height:1.6}
  kbd{background:#0f1116;border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:10px}

  /* モーダル */
  #modal{position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; z-index:50}
  #modal.on{display:flex}
  #modal .card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; width:320px}
  #modal h2{margin:0 0 12px; font-size:14px}
</style>
</head>
<body>
<div id="app">

  <!-- 左：ツール -->
  <div id="tools">
    <button class="tbtn" data-tool="pen"     title="ペン (B)">✏️<small>ペン</small></button>
    <button class="tbtn" data-tool="eraser"  title="消しゴム (E)">🩹<small>消し</small></button>
    <button class="tbtn" data-tool="fill"    title="塗りつぶし (G)">🪣<small>塗り</small></button>
    <button class="tbtn" data-tool="pick"    title="スポイト (I)">💧<small>スポイト</small></button>
    <div class="sep"></div>
    <button class="tbtn" data-tool="line"    title="直線 (L)">📏<small>線</small></button>
    <button class="tbtn" data-tool="rect"    title="四角 (R)">▭<small>四角</small></button>
    <button class="tbtn" data-tool="ellipse" title="円 (O)">◯<small>円</small></button>
    <button class="tbtn" data-tool="move"    title="移動 (M)">✥<small>移動</small></button>
    <div class="sep"></div>
    <button class="tbtn" id="btnUndo" title="元に戻す (⌘Z)">↩︎<small>戻す</small></button>
    <button class="tbtn" id="btnRedo" title="やり直し (⇧⌘Z)">↪︎<small>進む</small></button>
  </div>

  <!-- 中央 -->
  <div id="center">
    <div id="topbar">
      <button id="btnNew">新規</button>
      <button id="btnResize">サイズ変更</button>
      <span style="width:1px;height:22px;background:var(--line)"></span>
      <label>太さ</label>
      <select id="brush"><option>1</option><option>2</option><option>3</option><option>4</option></select>
      <label><input type="checkbox" id="shapeFill"> 図形を塗る</label>
      <span style="width:1px;height:22px;background:var(--line)"></span>
      <button id="zoomOut">−</button><span id="zoomLabel" style="min-width:44px;text-align:center">1200%</span><button id="zoomIn">＋</button>
      <button id="zoomFit">フィット</button>
      <label><input type="checkbox" id="grid" checked> グリッド</label>
      <label><input type="checkbox" id="onion"> オニオン</label>
      <span id="pos">— , —</span>
    </div>
    <div id="stage">
      <div id="wrap" class="checker">
        <canvas id="cv"></canvas>
        <canvas id="ov"></canvas>
      </div>
    </div>
  </div>

  <!-- 右：パネル -->
  <div id="side">

    <div class="box">
      <h3>パレット（256色）</h3>
      <div class="row" style="margin-bottom:8px">
        <div id="curcol"></div>
        <div style="flex:1">
          <div class="row">
            <input type="color" id="colEdit" style="width:44px;height:26px;padding:1px">
            <span id="colInfo" class="hint">#000000 / 0</span>
          </div>
          <div class="row" style="margin-top:4px">
            <button id="btnPalReset" style="font-size:11px;padding:3px 6px">初期化</button>
            <button id="btnPalGray" style="font-size:11px;padding:3px 6px">グレー化</button>
          </div>
        </div>
      </div>
      <div id="pal"></div>
      <div class="hint" style="margin-top:6px">色をクリックで選択／上のカラーで編集（全コマに反映）</div>
    </div>

    <div class="box">
      <h3>コマ（1〜4）</h3>
      <div id="frames"></div>
      <div class="row" style="margin-top:8px">
        <button id="btnAddFrame">＋ 追加</button>
        <button id="btnDupFrame">複製</button>
        <button id="btnDelFrame">削除</button>
      </div>
      <div class="row">
        <button id="btnClearFrame">全消去</button>
        <button id="btnFlipH">左右反転</button>
        <button id="btnFlipV">上下反転</button>
      </div>
    </div>

    <div class="box">
      <h3>プレビュー</h3>
      <canvas id="preview"></canvas>
      <div class="row" style="margin-top:8px; justify-content:center">
        <button id="btnPlay">▶ 再生</button>
        <label>FPS</label><input type="number" id="fps" value="8" min="1" max="30" style="width:52px">
        <select id="pvScale"><option value="2">2x</option><option value="4" selected>4x</option><option value="8">8x</option></select>
      </div>
    </div>

    <div class="box">
      <h3>PNG書き出し</h3>
      <div class="row">
        <label>倍率</label>
        <select id="exScale">
          <option value="1">1x</option><option value="2">2x</option><option value="4" selected>4x</option>
          <option value="8">8x</option><option value="16">16x</option>
        </select>
        <input type="text" id="exName" value="dot" style="flex:1;min-width:60px">
      </div>
      <div class="row"><button class="primary" id="exCur" style="flex:1">現在のコマを書き出し</button></div>
      <div class="row"><button id="exSheet" style="flex:1">スプライトシート（横並び）</button></div>
      <div class="row"><button id="exAll" style="flex:1">全コマを個別に書き出し</button></div>
      <div class="hint" style="margin-top:4px">未描画部分は透明（アルファ0）で出力されます。</div>
    </div>

    <div class="box">
      <h3>プロジェクト</h3>
      <div class="row">
        <button id="btnSave" style="flex:1">保存(.json)</button>
        <button id="btnLoad" style="flex:1">読込</button>
      </div>
      <input type="file" id="fileIn" accept="application/json,.json" style="display:none">
      <div class="hint" style="margin-top:6px">
        <kbd>B</kbd>ペン <kbd>E</kbd>消し <kbd>G</kbd>塗り <kbd>I</kbd>スポイト <kbd>L</kbd>線 <kbd>R</kbd>四角 <kbd>O</kbd>円 <kbd>M</kbd>移動<br>
        <kbd>⌘Z</kbd>戻す <kbd>⇧⌘Z</kbd>進む <kbd>[</kbd><kbd>]</kbd>コマ移動 <kbd>Space</kbd>再生<br>
        右ドラッグ＝消しゴム／<kbd>Alt</kbd>＋クリック＝スポイト
      </div>
    </div>

  </div>
</div>

<!-- モーダル -->
<div id="modal">
  <div class="card">
    <h2 id="mdTitle">キャンバスサイズ</h2>
    <div class="row"><label style="width:40px">横</label><input type="number" id="mdW" min="1" max="512" value="32"> px</div>
    <div class="row"><label style="width:40px">縦</label><input type="number" id="mdH" min="1" max="512" value="32"> px</div>
    <div class="row" style="margin-top:6px"><span class="hint">1〜512px。既存の絵は左上を基準に維持されます。</span></div>
    <div class="row" style="margin-top:14px; justify-content:flex-end">
      <button id="mdCancel">キャンセル</button>
      <button class="primary" id="mdOk">OK</button>
    </div>
  </div>
</div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const TRANSPARENT = -1;
const MAX_FRAMES = 4;

/* ================= 状態 ================= */
const S = {
  w: 32, h: 32,
  frames: [],           // Int16Array(w*h) : パレット索引 / -1=透明
  cur: 0,
  palette: [],          // 256色 [r,g,b]
  sel: 1,               // 選択中パレット索引
  tool: 'pen',
  brush: 1,
  zoom: 12,
  grid: true,
  onion: false,
  fps: 8,
  shapeFill: false,
};
let undoStack = [], redoStack = [];

/* ================= パレット ================= */
function hsv2rgb(h,s,v){
  h=(h%360+360)%360/60; const c=v*s, x=c*(1-Math.abs(h%2-1)), m=v-c;
  let r,g,b;
  if(h<1)[r,g,b]=[c,x,0]; else if(h<2)[r,g,b]=[x,c,0]; else if(h<3)[r,g,b]=[0,c,x];
  else if(h<4)[r,g,b]=[0,x,c]; else if(h<5)[r,g,b]=[x,0,c]; else [r,g,b]=[c,0,x];
  return [Math.round((r+m)*255),Math.round((g+m)*255),Math.round((b+m)*255)];
}
function defaultPalette(){
  const p = [];
  // 行0: グレースケール16段
  for(let i=0;i<16;i++){ const v=Math.round(i*255/15); p.push([v,v,v]); }
  // 行1〜15: 列=色相16 / 行=明度・彩度15段
  const LV = [
    [1,.28],[1,.42],[1,.56],[1,.70],[1,.85],[1,1],
    [.80,1],[.62,1],[.46,1],[.32,1],[.18,1],
    [.55,.50],[.45,.72],[.30,.92],[.65,.35]
  ];
  for(const [s,v] of LV) for(let hue=0;hue<16;hue++) p.push(hsv2rgb(hue*22.5,s,v));
  return p;                                   // 16 + 240 = 256
}
const hex = c => '#'+c.map(v=>v.toString(16).padStart(2,'0')).join('');
const unhex = s => [parseInt(s.slice(1,3),16),parseInt(s.slice(3,5),16),parseInt(s.slice(5,7),16)];

/* ================= 初期化 ================= */
const cv=$('#cv'), ctx=cv.getContext('2d');
const ov=$('#ov'), octx=ov.getContext('2d');
const off=document.createElement('canvas'); const octxOff=off.getContext('2d');

function newFrame(w=S.w,h=S.h){ const a=new Int16Array(w*h); a.fill(TRANSPARENT); return a; }

function init(w,h){
  S.w=w; S.h=h; S.frames=[newFrame()]; S.cur=0;
  undoStack=[]; redoStack=[];
  fitZoom(); layout(); buildPalette(); renderAll();
}

/* ================= レイアウト・描画 ================= */
function layout(){
  cv.width=S.w; cv.height=S.h;
  const dpr=Math.min(2, window.devicePixelRatio||1); S.dpr=dpr;
  ov.width=Math.round(S.w*S.zoom*dpr); ov.height=Math.round(S.h*S.zoom*dpr);
  off.width=S.w; off.height=S.h;
  const w=S.w*S.zoom, h=S.h*S.zoom;
  cv.style.width=w+'px'; cv.style.height=h+'px';
  ov.style.width=w+'px'; ov.style.height=h+'px';
  $('#wrap').style.width=w+'px'; $('#wrap').style.height=h+'px';
  $('#zoomLabel').textContent=Math.round(S.zoom*100)+'%';
  // canvas.width への代入で内容が消えるため、必ず描き直す
  if(S.frames.length){ drawCanvas(); drawGrid(); }
}
function fitZoom(){
  const st=$('#stage');
  const aw=Math.max(120, st.clientWidth-48), ah=Math.max(120, st.clientHeight-48);
  S.zoom=Math.max(1, Math.min(48, Math.floor(Math.min(aw/S.w, ah/S.h))));
}
function frameToImageData(f){
  const img=ctx.createImageData(S.w,S.h), d=img.data;
  for(let i=0;i<f.length;i++){
    const idx=f[i]; const o=i*4;
    if(idx<0){ d[o+3]=0; continue; }
    const c=S.palette[idx]||[0,0,0];
    d[o]=c[0]; d[o+1]=c[1]; d[o+2]=c[2]; d[o+3]=255;
  }
  return img;
}
function drawCanvas(){
  ctx.clearRect(0,0,S.w,S.h);
  if(S.onion && S.frames.length>1){
    const prev=S.frames[(S.cur-1+S.frames.length)%S.frames.length];
    octxOff.putImageData(frameToImageData(prev),0,0);
    ctx.globalAlpha=.3; ctx.drawImage(off,0,0); ctx.globalAlpha=1;
  }
  octxOff.putImageData(frameToImageData(S.frames[S.cur]),0,0);
  ctx.drawImage(off,0,0);
}
function drawGrid(){
  const dpr=S.dpr||1, W=S.w*S.zoom, H=S.h*S.zoom;
  octx.setTransform(dpr,0,0,dpr,0,0);
  octx.clearRect(0,0,W,H);
  if(!S.grid || S.zoom<4) return;
  octx.lineWidth=1/dpr;
  octx.strokeStyle='rgba(255,255,255,.22)';
  octx.beginPath();
  for(let x=1;x<S.w;x++){ const p=x*S.zoom; octx.moveTo(p,0); octx.lineTo(p,H); }
  for(let y=1;y<S.h;y++){ const p=y*S.zoom; octx.moveTo(0,p); octx.lineTo(W,p); }
  octx.stroke();
  if(S.zoom>=6){                                   // 8px ごとの補助線
    octx.lineWidth=1; octx.strokeStyle='rgba(120,200,255,.55)'; octx.beginPath();
    for(let x=8;x<S.w;x+=8){ const p=x*S.zoom; octx.moveTo(p,0); octx.lineTo(p,H); }
    for(let y=8;y<S.h;y+=8){ const p=y*S.zoom; octx.moveTo(0,p); octx.lineTo(W,p); }
    octx.stroke();
  }
}
function renderAll(){ drawCanvas(); drawGrid(); renderFrames(); renderPalSel(); save(); }

/* ================= 画素操作 ================= */
const inside=(x,y)=> x>=0&&y>=0&&x<S.w&&y<S.h;
function setPx(f,x,y,v){ if(inside(x,y)) f[y*S.w+x]=v; }
function getPx(f,x,y){ return inside(x,y)? f[y*S.w+x] : TRANSPARENT; }
function stamp(f,x,y,v){                            // ブラシ太さ
  const b=S.brush, o=Math.floor((b-1)/2);
  for(let dy=0;dy<b;dy++) for(let dx=0;dx<b;dx++) setPx(f,x-o+dx,y-o+dy,v);
}
function lineEach(x0,y0,x1,y1,fn){                  // Bresenham
  let dx=Math.abs(x1-x0), dy=-Math.abs(y1-y0);
  let sx=x0<x1?1:-1, sy=y0<y1?1:-1, err=dx+dy;
  for(;;){ fn(x0,y0);
    if(x0===x1&&y0===y1) break;
    const e2=2*err;
    if(e2>=dy){ err+=dy; x0+=sx; }
    if(e2<=dx){ err+=dx; y0+=sy; }
  }
}
function rectEach(x0,y0,x1,y1,fill,fn){
  const ax=Math.min(x0,x1), bx=Math.max(x0,x1), ay=Math.min(y0,y1), by=Math.max(y0,y1);
  for(let y=ay;y<=by;y++) for(let x=ax;x<=bx;x++){
    if(fill || x===ax||x===bx||y===ay||y===by) fn(x,y);
  }
}
function ellipseEach(x0,y0,x1,y1,fill,fn){
  const cx=(x0+x1)/2, cy=(y0+y1)/2;
  const rx=Math.abs(x1-x0)/2+.5, ry=Math.abs(y1-y0)/2+.5;
  const ax=Math.min(x0,x1), bx=Math.max(x0,x1), ay=Math.min(y0,y1), by=Math.max(y0,y1);
  for(let y=ay;y<=by;y++) for(let x=ax;x<=bx;x++){
    const d=((x+.5-cx)/rx)**2+((y+.5-cy)/ry)**2;
    if(d<=1){
      if(fill){ fn(x,y); }
      else{
        const inx=((x+.5-cx)/(rx-1||.0001))**2+((y+.5-cy)/(ry-1||.0001))**2;
        if(inx>1) fn(x,y);
      }
    }
  }
}
function floodFill(f,x,y,v){
  const t=getPx(f,x,y); if(t===v) return;
  const st=[[x,y]];
  while(st.length){
    const [px,py]=st.pop();
    if(!inside(px,py)||f[py*S.w+px]!==t) continue;
    f[py*S.w+px]=v;
    st.push([px+1,py],[px-1,py],[px,py+1],[px,py-1]);
  }
}

/* ================= Undo / Redo ================= */
function snapshot(){
  return { w:S.w, h:S.h, cur:S.cur, frames:S.frames.map(f=>Int16Array.from(f)) };
}
function pushUndo(){ undoStack.push(snapshot()); if(undoStack.length>60) undoStack.shift(); redoStack=[]; updUndo(); }
function applySnap(s){ S.w=s.w; S.h=s.h; S.frames=s.frames.map(f=>Int16Array.from(f)); S.cur=Math.min(s.cur,S.frames.length-1); layout(); renderAll(); }
function undo(){ if(!undoStack.length) return; redoStack.push(snapshot()); applySnap(undoStack.pop()); updUndo(); }
function redo(){ if(!redoStack.length) return; undoStack.push(snapshot()); applySnap(redoStack.pop()); updUndo(); }
function updUndo(){ $('#btnUndo').disabled=!undoStack.length; $('#btnRedo').disabled=!redoStack.length; }

/* ================= 入力 ================= */
let drawing=false, startPt=null, lastPt=null, drawVal=0, baseFrame=null;

function pt(e){
  const r=cv.getBoundingClientRect();
  return {
    x: Math.floor((e.clientX-r.left)/r.width*S.w),
    y: Math.floor((e.clientY-r.top)/r.height*S.h)
  };
}
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{
  const p=pt(e); if(!inside(p.x,p.y)) return;
  cv.setPointerCapture(e.pointerId);
  const f=S.frames[S.cur];

  if(e.altKey || S.tool==='pick'){ pickColor(p); return; }

  const erase = (e.button===2) || S.tool==='eraser';
  drawVal = erase ? TRANSPARENT : S.sel;
  pushUndo();
  drawing=true; startPt=p; lastPt=p;
  baseFrame=Int16Array.from(f);

  if(S.tool==='fill' && !erase){ floodFill(f,p.x,p.y,S.sel); drawCanvas(); renderFrames(); }
  else if(S.tool==='fill' && erase){ floodFill(f,p.x,p.y,TRANSPARENT); drawCanvas(); renderFrames(); }
  else if(S.tool==='pen'||S.tool==='eraser'){ stamp(f,p.x,p.y,drawVal); drawCanvas(); }
});
cv.addEventListener('pointermove',e=>{
  const p=pt(e);
  $('#pos').textContent = inside(p.x,p.y) ? `${p.x} , ${p.y}` : '— , —';
  if(!drawing) return;
  const f=S.frames[S.cur];

  if(S.tool==='pen'||S.tool==='eraser'){
    lineEach(lastPt.x,lastPt.y,p.x,p.y,(x,y)=>stamp(f,x,y,drawVal));
    lastPt=p; drawCanvas();
  } else if(S.tool==='move'){
    const dx=p.x-startPt.x, dy=p.y-startPt.y;
    for(let y=0;y<S.h;y++) for(let x=0;x<S.w;x++){
      const sx=x-dx, sy=y-dy;
      f[y*S.w+x] = (sx>=0&&sy>=0&&sx<S.w&&sy<S.h) ? baseFrame[sy*S.w+sx] : TRANSPARENT;
    }
    drawCanvas();
  } else if(S.tool==='line'||S.tool==='rect'||S.tool==='ellipse'){
    f.set(baseFrame);
    shapeApply(f,startPt,p,drawVal);
    drawCanvas();
  }
});
function shapeApply(f,a,b,v){
  const put=(x,y)=>stamp(f,x,y,v);
  if(S.tool==='line') lineEach(a.x,a.y,b.x,b.y,put);
  else if(S.tool==='rect') rectEach(a.x,a.y,b.x,b.y,S.shapeFill,(x,y)=>setPx(f,x,y,v));
  else if(S.tool==='ellipse') ellipseEach(a.x,a.y,b.x,b.y,S.shapeFill,(x,y)=>setPx(f,x,y,v));
}
function endDraw(){
  if(!drawing) return;
  drawing=false; baseFrame=null;
  renderAll();
}
cv.addEventListener('pointerup',endDraw);
cv.addEventListener('pointercancel',endDraw);
cv.addEventListener('pointerleave',()=>{ $('#pos').textContent='— , —'; });

function pickColor(p){
  const v=getPx(S.frames[S.cur],p.x,p.y);
  if(v>=0){ S.sel=v; renderPalSel(); }
}

/* ================= パレットUI ================= */
function buildPalette(){
  const el=$('#pal'); el.innerHTML='';
  S.palette.forEach((c,i)=>{
    const d=document.createElement('div');
    d.style.background=hex(c); d.title=`#${i} ${hex(c)}`; d.dataset.i=i;
    d.addEventListener('pointerdown',()=>{ S.sel=i; renderPalSel(); });
    el.appendChild(d);
  });
  renderPalSel();
}
function renderPalSel(){
  [...$('#pal').children].forEach((d,i)=>d.classList.toggle('sel', i===S.sel));
  const c=S.palette[S.sel];
  $('#curcol').style.background=hex(c);
  $('#colEdit').value=hex(c);
  $('#colInfo').textContent=`${hex(c)} / index ${S.sel}`;
}
$('#colEdit').addEventListener('input',e=>{
  S.palette[S.sel]=unhex(e.target.value);
  $('#pal').children[S.sel].style.background=e.target.value;
  renderPalSel(); drawCanvas(); renderFrames(); save();
});
$('#btnPalReset').onclick=()=>{ if(!confirm('パレットを初期状態に戻します。よろしいですか？')) return;
  S.palette=defaultPalette(); buildPalette(); drawCanvas(); renderFrames(); save(); };
$('#btnPalGray').onclick=()=>{
  S.palette=S.palette.map(c=>{ const v=Math.round(.299*c[0]+.587*c[1]+.114*c[2]); return [v,v,v]; });
  buildPalette(); drawCanvas(); renderFrames(); save();
};

/* ================= フレームUI ================= */
function renderFrames(){
  const el=$('#frames'); el.innerHTML='';
  S.frames.forEach((f,i)=>{
    const d=document.createElement('div'); d.className='fr'+(i===S.cur?' on':'');
    const c=document.createElement('canvas'); c.width=S.w; c.height=S.h;
    c.getContext('2d').putImageData(frameToImageData(f),0,0);
    const b=document.createElement('b'); b.textContent=i+1;
    d.appendChild(c); d.appendChild(b);
    d.onclick=()=>{ S.cur=i; renderAll(); };
    el.appendChild(d);
  });
  $('#btnAddFrame').disabled = S.frames.length>=MAX_FRAMES;
  $('#btnDupFrame').disabled = S.frames.length>=MAX_FRAMES;
  $('#btnDelFrame').disabled = S.frames.length<=1;
  drawPreview();
}
$('#btnAddFrame').onclick=()=>{ if(S.frames.length>=MAX_FRAMES) return; pushUndo(); S.frames.push(newFrame()); S.cur=S.frames.length-1; renderAll(); };
$('#btnDupFrame').onclick=()=>{ if(S.frames.length>=MAX_FRAMES) return; pushUndo(); S.frames.splice(S.cur+1,0,Int16Array.from(S.frames[S.cur])); S.cur++; renderAll(); };
$('#btnDelFrame').onclick=()=>{ if(S.frames.length<=1) return; pushUndo(); S.frames.splice(S.cur,1); S.cur=Math.max(0,S.cur-1); renderAll(); };
$('#btnClearFrame').onclick=()=>{ pushUndo(); S.frames[S.cur].fill(TRANSPARENT); renderAll(); };
$('#btnFlipH').onclick=()=>{ pushUndo(); const f=S.frames[S.cur], n=Int16Array.from(f);
  for(let y=0;y<S.h;y++)for(let x=0;x<S.w;x++) f[y*S.w+x]=n[y*S.w+(S.w-1-x)]; renderAll(); };
$('#btnFlipV').onclick=()=>{ pushUndo(); const f=S.frames[S.cur], n=Int16Array.from(f);
  for(let y=0;y<S.h;y++)for(let x=0;x<S.w;x++) f[y*S.w+x]=n[(S.h-1-y)*S.w+x]; renderAll(); };

/* ================= プレビュー ================= */
let playing=false, playTimer=null, playIdx=0;
function drawPreview(){
  const sc=+$('#pvScale').value;
  const pv=$('#preview'), c=pv.getContext('2d');
  pv.width=S.w*sc; pv.height=S.h*sc;
  pv.style.width=Math.min(240,S.w*sc)+'px';
  pv.style.height=(Math.min(240,S.w*sc)/S.w*S.h)+'px';
  const i = playing ? playIdx % S.frames.length : S.cur;
  octxOff.putImageData(frameToImageData(S.frames[i]),0,0);
  c.imageSmoothingEnabled=false;
  c.clearRect(0,0,pv.width,pv.height);
  c.drawImage(off,0,0,pv.width,pv.height);
}
function togglePlay(){
  playing=!playing;
  $('#btnPlay').textContent = playing ? '■ 停止' : '▶ 再生';
  clearInterval(playTimer);
  if(playing){ playIdx=0; playTimer=setInterval(()=>{ playIdx++; drawPreview(); }, 1000/Math.max(1,+$('#fps').value)); }
  drawPreview();
}
$('#btnPlay').onclick=togglePlay;
$('#fps').oninput=()=>{ if(playing){ togglePlay(); togglePlay(); } save(); };
$('#pvScale').onchange=drawPreview;

/* ================= 書き出し ================= */
function renderTo(canvas, frames, scale){
  const c=canvas.getContext('2d');
  canvas.width=S.w*frames.length*scale; canvas.height=S.h*scale;
  c.imageSmoothingEnabled=false;
  c.clearRect(0,0,canvas.width,canvas.height);
  frames.forEach((f,i)=>{
    octxOff.putImageData(frameToImageData(f),0,0);
    c.drawImage(off, i*S.w*scale, 0, S.w*scale, S.h*scale);
  });
}
function download(canvas,name){
  canvas.toBlob(b=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(b); a.download=name;
    a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  },'image/png');
}
const exName=()=> ($('#exName').value.trim()||'dot');
$('#exCur').onclick=()=>{ const c=document.createElement('canvas');
  renderTo(c,[S.frames[S.cur]],+$('#exScale').value); download(c,`${exName()}_${S.cur+1}.png`); };
$('#exSheet').onclick=()=>{ const c=document.createElement('canvas');
  renderTo(c,S.frames,+$('#exScale').value); download(c,`${exName()}_sheet_${S.frames.length}f.png`); };
$('#exAll').onclick=()=>{ S.frames.forEach((f,i)=>setTimeout(()=>{
  const c=document.createElement('canvas'); renderTo(c,[f],+$('#exScale').value);
  download(c,`${exName()}_${i+1}.png`); }, i*250)); };

/* ================= 保存・読込 ================= */
function serialize(){
  return JSON.stringify({
    v:1, w:S.w, h:S.h, fps:+$('#fps').value, sel:S.sel,
    palette:S.palette, frames:S.frames.map(f=>Array.from(f))
  });
}
function save(){ try{ localStorage.setItem('dotEditor', serialize()); }catch(e){} }
function load(json){
  const d=JSON.parse(json);
  S.w=d.w; S.h=d.h;
  S.palette=(d.palette&&d.palette.length===256)? d.palette : defaultPalette();
  S.frames=d.frames.slice(0,MAX_FRAMES).map(a=>Int16Array.from(a));
  if(!S.frames.length) S.frames=[newFrame()];
  S.cur=0; S.sel=Math.min(Math.max(0, d.sel ?? S.sel), 255);
  if(d.fps) $('#fps').value=d.fps;
  undoStack=[]; redoStack=[]; updUndo();
  fitZoom(); layout(); buildPalette(); renderAll();
}
$('#btnSave').onclick=()=>{
  const b=new Blob([serialize()],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b);
  a.download=`${exName()}.json`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
};
$('#btnLoad').onclick=()=>$('#fileIn').click();
$('#fileIn').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ load(r.result); }catch(err){ alert('読み込めませんでした: '+err.message); } };
  r.readAsText(f); e.target.value='';
};

/* ================= ツールバー ================= */
document.querySelectorAll('[data-tool]').forEach(b=>{
  b.onclick=()=>setTool(b.dataset.tool);
});
function setTool(t){
  S.tool=t;
  document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('on', b.dataset.tool===t));
}
$('#btnUndo').onclick=undo; $('#btnRedo').onclick=redo;
$('#brush').onchange=e=>S.brush=+e.target.value;
$('#shapeFill').onchange=e=>S.shapeFill=e.target.checked;
$('#grid').onchange=e=>{ S.grid=e.target.checked; drawGrid(); };
$('#onion').onchange=e=>{ S.onion=e.target.checked; drawCanvas(); };
let userZoomed=false;
$('#zoomIn').onclick=()=>{ userZoomed=true; S.zoom=Math.min(64,S.zoom+ (S.zoom<8?1:4)); layout(); };
$('#zoomOut').onclick=()=>{ userZoomed=true; S.zoom=Math.max(1,S.zoom- (S.zoom<=8?1:4)); layout(); };
$('#zoomFit').onclick=()=>{ userZoomed=false; fitZoom(); layout(); };

/* サイズ変更 / 新規 */
let modalMode='resize';
function openModal(mode){
  modalMode=mode;
  $('#mdTitle').textContent = mode==='new' ? '新規キャンバス' : 'キャンバスサイズ変更';
  $('#mdW').value=S.w; $('#mdH').value=S.h;
  $('#modal').classList.add('on'); $('#mdW').focus(); $('#mdW').select();
}
$('#btnResize').onclick=()=>openModal('resize');
$('#btnNew').onclick=()=>openModal('new');
$('#mdCancel').onclick=()=>$('#modal').classList.remove('on');
$('#modal').addEventListener('pointerdown',e=>{ if(e.target.id==='modal') $('#modal').classList.remove('on'); });
$('#mdOk').onclick=()=>{
  const w=Math.max(1,Math.min(512, Math.round(+$('#mdW').value)||1));
  const h=Math.max(1,Math.min(512, Math.round(+$('#mdH').value)||1));
  $('#modal').classList.remove('on');
  if(modalMode==='new'){
    if(!confirm('現在の絵を破棄して新規作成します。よろしいですか？')) return;
    const pal=S.palette; init(w,h); S.palette=pal; buildPalette(); renderAll();
  }else{
    pushUndo();
    const old=S.frames, ow=S.w, oh=S.h;
    S.w=w; S.h=h;
    S.frames=old.map(f=>{
      const n=newFrame(w,h); n.fill(TRANSPARENT);
      for(let y=0;y<Math.min(h,oh);y++) for(let x=0;x<Math.min(w,ow);x++) n[y*w+x]=f[y*ow+x];
      return n;
    });
    fitZoom(); layout(); renderAll();
  }
};

/* ================= キーボード ================= */
document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='select'||tag==='textarea') return;
  const meta=e.metaKey||e.ctrlKey;
  if(meta && e.key.toLowerCase()==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
  if(meta && e.key.toLowerCase()==='s'){ e.preventDefault(); $('#btnSave').click(); return; }
  if(meta) return;
  const k=e.key.toLowerCase();
  const map={b:'pen',e:'eraser',g:'fill',i:'pick',l:'line',r:'rect',o:'ellipse',m:'move'};
  if(map[k]){ setTool(map[k]); return; }
  if(k===']'){ S.cur=(S.cur+1)%S.frames.length; renderAll(); }
  if(k==='['){ S.cur=(S.cur-1+S.frames.length)%S.frames.length; renderAll(); }
  if(e.code==='Space'){ e.preventDefault(); togglePlay(); }
});
// 手動ズームしていない間はウィンドウサイズに追従してフィット
window.addEventListener('resize',()=>{ if(!userZoomed){ fitZoom(); layout(); } });

/* ================= 起動 ================= */
S.palette=defaultPalette();
setTool('pen');
$('#pal') && buildPalette();
S.sel=6;
const saved=localStorage.getItem('dotEditor');
if(saved){ try{ load(saved); }catch(e){ init(32,32); } } else { init(32,32); }
renderPalSel();
updUndo();
// 初回レイアウト確定後にフィット（file:// 直開き時に stage 実寸が遅れて確定するため）
requestAnimationFrame(()=>{ fitZoom(); layout(); });
// デバッグ／外部連携用フック
window.DOT = { S, renderTo, frameToImageData, load, serialize };
</script>
</body>
</html>
